<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aidan Miller</title>
<style>
  :root {
    --ground: #DDD9F2;
    --ink: #241B45;
    --ink-soft: #564b7d;
    --mark: #8C1F3F;
    --on-mark: #F6F3FF;
    --bloom-1: #8C1F3F;
    --bloom-2: #6C4CE0;
    --bloom-opacity: 0.30;
    --bloom-blend: multiply;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #1B1434;
      --ink: #E4E0F7;
      --ink-soft: #a29ac9;
      --mark: #F0A8C0;
      --on-mark: #1B1434;
      --bloom-1: #B5265C;
      --bloom-2: #5B3FD6;
      --bloom-opacity: 0.50;
      --bloom-blend: screen;
    }
  }

  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }

  body {
    position: relative;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 4rem 1rem;
    overflow-x: hidden;
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* One large still bloom anchored low-left. The contact page drifts;
     this page holds steady. Same palette, different composition. */
  .bloom {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    mix-blend-mode: var(--bloom-blend);
    opacity: var(--bloom-opacity);
    background:
      radial-gradient(70vmax 70vmax at 8% 88%, var(--bloom-1), transparent 62%),
      radial-gradient(58vmax 58vmax at 88% 8%, var(--bloom-2), transparent 60%);
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 46rem;
    margin: 0 auto;
  }

  h1 {
    margin: 0 0 1.75rem;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .statement {
    margin: 0;
    max-width: 24ch;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2.1rem, 7.5vw, 4.25rem);
    font-weight: 400;
    line-height: 1.04;
    letter-spacing: -0.02em;
    text-wrap: balance;
  }

  .statement .now {
    color: var(--mark);
  }

  .cta {
    position: relative;
    display: inline-block;
    margin-top: 3rem;
    padding: 1.0625rem 2.5rem;
    overflow: hidden;
    background: var(--mark);
    color: var(--on-mark);
    font-size: 1.125rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-decoration: none;
    transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  /* A light sweeps across the button when you point at it. */
  .cta::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -60%;
    width: 45%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.45), transparent);
    transform: skewX(-18deg);
  }

  .cta:hover,
  .cta:focus-visible {
    transform: translateY(-2px);
  }

  .cta:hover::after,
  .cta:focus-visible::after {
    animation: sweep 620ms ease-out;
  }

  .cta:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
  }

  @keyframes sweep {
    from { left: -60%; }
    to   { left: 130%; }
  }

  main > * {
    animation: rise 700ms cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
  }
  h1 { animation-delay: 60ms; }
  .statement { animation-delay: 160ms; }
  .cta { animation-delay: 400ms; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(0.6rem); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    main > * { animation: none; }
    .cta { transition: none; }
    .cta:hover::after,
    .cta:focus-visible::after { animation: none; }
  }
</style>
</head>
<body>
  <div class="bloom" aria-hidden="true"></div>

  <main>
    <h1>Aidan Miller</h1>

    <p class="statement">Computer science student at Monmouth
      University. I made a music web app, and
      <span class="now">now I'm making one that tracks Brawl Stars
      stats.</span></p>

    <a class="cta" href="contact.html">Reach me</a>
  </main>
</body>
</html>
