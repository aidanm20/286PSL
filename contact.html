<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reach me — Aidan Miller</title>
<style>
  :root {
    --ground: #DDD9F2;
    --ink: #241B45;
    --ink-soft: #564b7d;
    --mark: #8C1F3F;
    --rule: #bdb6e0;
    --aurora-1: #8C1F3F;
    --aurora-2: #6C4CE0;
    --aurora-3: #E86A9A;
    --aurora-opacity: 0.38;
    --aurora-blend: multiply;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #1B1434;
      --ink: #E4E0F7;
      --ink-soft: #a29ac9;
      --mark: #F0A8C0;
      --rule: #3b3163;
      --aurora-1: #B5265C;
      --aurora-2: #5B3FD6;
      --aurora-3: #2E7FA8;
      --aurora-opacity: 0.55;
      --aurora-blend: screen;
    }
  }

  * { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }

  body {
    position: relative;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 4rem 1rem;
    overflow-x: hidden;
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  /* Drifting aurora: three blurred blobs, no scripts involved. */
  .aurora {
    position: fixed;
    inset: -20vmax;
    z-index: 0;
    pointer-events: none;
    mix-blend-mode: var(--aurora-blend);
  }

  .aurora span {
    position: absolute;
    width: 62vmax;
    height: 62vmax;
    border-radius: 50%;
    opacity: var(--aurora-opacity);
    filter: blur(8vmax);
    will-change: transform;
  }

  .aurora span:nth-child(1) {
    top: 2%;
    left: -6%;
    background: radial-gradient(circle at center, var(--aurora-1), transparent 68%);
    animation: drift-a 26s ease-in-out infinite alternate;
  }

  .aurora span:nth-child(2) {
    top: 26%;
    left: 44%;
    background: radial-gradient(circle at center, var(--aurora-2), transparent 68%);
    animation: drift-b 34s ease-in-out infinite alternate;
  }

  .aurora span:nth-child(3) {
    top: 52%;
    left: 8%;
    background: radial-gradient(circle at center, var(--aurora-3), transparent 68%);
    animation: drift-c 30s ease-in-out infinite alternate;
  }

  @keyframes drift-a {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(14vmax, 8vmax, 0) scale(1.22); }
  }

  @keyframes drift-b {
    from { transform: translate3d(0, 0, 0) scale(1.1); }
    to   { transform: translate3d(-16vmax, 10vmax, 0) scale(0.9); }
  }

  @keyframes drift-c {
    from { transform: translate3d(0, 0, 0) scale(0.95); }
    to   { transform: translate3d(12vmax, -12vmax, 0) scale(1.18); }
  }

  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 46rem;
    margin: 0 auto;
  }

  .home {
    display: inline-block;
    margin-bottom: 2.5rem;
    color: var(--ink);
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-decoration-color: var(--ink-soft);
    text-underline-offset: 0.3em;
  }

  h1 {
    margin: 0;
    max-width: 22ch;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2.1rem, 7.5vw, 4rem);
    font-weight: 400;
    line-height: 1.04;
    letter-spacing: -0.02em;
  }

  .lede {
    margin: 1.5rem 0 0;
    max-width: 44ch;
    color: var(--ink-soft);
    font-size: 1.0625rem;
    line-height: 1.6;
  }

  .channels {
    margin: 3rem 0 0;
    padding: 0;
    list-style: none;
  }

  .channels a {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem 1.5rem;
    align-items: baseline;
    justify-content: space-between;
    padding: 1.25rem 0;
    border-top: 1px solid var(--rule);
    color: var(--ink);
    text-decoration: none;
  }

  .channels li:last-child a {
    border-bottom: 1px solid var(--rule);
  }

  .channel-name {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.5rem;
    transition: transform 260ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .channel-note {
    color: var(--ink-soft);
    font-size: 0.9375rem;
  }

  /* Underline grows from the left when you point at a row. */
  .channels a::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 2px;
    background: var(--mark);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 320ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .channels a:hover::after,
  .channels a:focus-visible::after {
    transform: scaleX(1);
  }

  .channels a:hover .channel-name,
  .channels a:focus-visible .channel-name {
    transform: translateX(0.5rem);
  }

  .channels a:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
  }

  .home:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
  }

  footer {
    margin-top: 2.5rem;
    color: var(--ink-soft);
    font-size: 0.8125rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .aurora span { animation: none; }
    .channel-name,
    .channels a::after { transition: none; }
  }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <main>
    <a class="home" href="index.html">Aidan Miller</a>

    <h1>Two good ways to reach me</h1>

    <p class="lede">LinkedIn gets my attention fastest. GitHub shows what I'm
      building right now, including the Brawl Stars stats app.</p>

    <ul class="channels">
      <li>
        <a href="https://www.linkedin.com/in/aidan-miller-2b29a5335/">
          <span class="channel-name">LinkedIn</span>
          <span class="channel-note">Messages about work, internships, or classes</span>
        </a>
      </li>
      <li>
        <a href="https://github.com/aidanm20">
          <span class="channel-name">GitHub</span>
          <span class="channel-note">Projects, in progress and finished</span>
        </a>
      </li>
    </ul>

    <footer>Updated September 2026</footer>
  </main>
</body>
</html>
